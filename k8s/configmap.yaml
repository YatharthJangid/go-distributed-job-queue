apiVersion: v1
kind: ConfigMap
metadata:
  name: gores-config
  labels:
    app: gores
data:
  config.json: |
    {
      "redis": {
        "host": "redis",
        "port": 6379,
        "db": 0,
        "pool_size": 10,
        "max_idle": 50,
        "max_active": 200,
        "idle_timeout": 300
      }
    }
